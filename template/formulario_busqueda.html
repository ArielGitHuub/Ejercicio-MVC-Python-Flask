<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Comisiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 20px; }
        .container-box { max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 25px; color: #333; }
        .btn-custom { background-color: #4CAF50; color: white; width: 100%; border: none; padding: 10px; font-size: 16px; border-radius: 4px; }
        .btn-custom:hover { background-color: #4CAF50; color: white; }
        footer { background-color: #f9f9f9; padding: 20px; text-align: center; margin-top: 40px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container-box">
        <h1>Buscar Comisiones</h1>
        
        {% if error %}
        <div class="alert alert-danger text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/comisiones" id="form-fechas">
            <div class="mb-3">
                <label for="fecha_inicio" class="form-label fw-bold">Fecha de inicio:</label>
                <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" 
                       min="2026-05-01" max="{{ max_date }}" required>
            </div>
            <div class="mb-4">
                <label for="fecha_fin" class="form-label fw-bold">Fecha de fin:</label>
                <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" 
                       min="2026-05-01" max="{{ max_date }}" required>
            </div>
            <button type="submit" class="btn-custom fw-bold">Buscar</button>
        </form>
    </div>

    <!-- Bloqueo en Frontend -->
    <script>
        document.getElementById("fecha_inicio").addEventListener("change", function() {
            let fechaInicio = this.value;
            document.getElementById("fecha_fin").min = fechaInicio;
        });
    </script>
</body>
</html>
