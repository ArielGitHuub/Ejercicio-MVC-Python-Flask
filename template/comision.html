<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comisiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 20px; }
        .container-box { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div class="container-box">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0">Reporte de Comisiones</h2>
            <a href="/" class="btn btn-secondary btn-sm">← Nueva Búsqueda</a>
        </div>
        
        <table class="table table-bordered table-striped mt-3">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Total Ventas</th>
                    <th>Comisión</th>
                </tr>
            </thead>
            <tbody>
                {% for c in comision %}
                <tr>
                    <td>{{ c.nombre }} {{ c.apellido }}</td>
                    <td>${{ "%.2f"|format(c.total_ventas) }}</td>
                    <td class="text-success fw-bold">${{ "%.2f"|format(c.comision) }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">No se encontraron registros de ventas en estas fechas.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
